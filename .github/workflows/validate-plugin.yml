name: Validate Plugin

on:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/validate-plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/validate-plugin.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Prepare plugin structure
        run: |
          # Copy plugin files to root
          cp -r plugin/www .
          cp plugin/hacs.json .
          cp plugin/info.md .
          cp plugin/README.md .
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
