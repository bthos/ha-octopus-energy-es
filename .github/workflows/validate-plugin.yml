name: Validate Plugin

on:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/validate-plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/validate-plugin.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "plugin"
          path: "plugin"
