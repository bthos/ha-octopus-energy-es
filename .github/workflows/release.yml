name: Release

on:
  workflow_run:
    workflows: ["Validate", "Test"]
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: write
  actions: read

jobs:
  check-workflows:
    # Check that both Validate and Test workflows succeeded
    runs-on: ubuntu-latest
    outputs:
      validate-success: ${{ steps.check.outputs.validate-success }}
      test-success: ${{ steps.check.outputs.test-success }}
      both-success: ${{ steps.check.outputs.both-success }}
    steps:
      - name: Check Validate and Test workflows status
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'validate.yml',
              branch: '${{ github.event.workflow_run.head_branch }}',
              per_page: 1
            });
            
            const validateSuccess = runs.workflow_runs[0]?.conclusion === 'success';
            
            const { data: testRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              branch: '${{ github.event.workflow_run.head_branch }}',
              per_page: 1
            });
            
            const testSuccess = testRuns.workflow_runs[0]?.conclusion === 'success';
            
            core.setOutput('validate-success', validateSuccess);
            core.setOutput('test-success', testSuccess);
            core.setOutput('both-success', validateSuccess && testSuccess);
            
            console.log(`Validate workflow: ${validateSuccess ? 'success' : 'failed/not found'}`);
            console.log(`Test workflow: ${testSuccess ? 'success' : 'failed/not found'}`);

  release:
    # Only run release if current workflow succeeded AND both Validate and Test workflows succeeded
    # This ensures both validation and tests must pass before release
    needs: check-workflows
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.check-workflows.outputs.both-success == 'true' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-tags: true

      - name: Get current version from manifest
        id: get_current_version
        run: |
          CURRENT_VERSION=$(python3 -c "import json; f=open('custom_components/octopus_energy_es/manifest.json'); data=json.load(f); print(data['version']); f.close()")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate next version
        id: calculate_version
        run: |
          CURRENT_VERSION="${{ steps.get_current_version.outputs.current_version }}"
          # Parse version (e.g., 0.4.35 -> 0.4.36)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version in manifest.json
        run: |
          NEW_VERSION="${{ steps.calculate_version.outputs.new_version }}"
          python3 << EOF
          import json
          import re
          
          with open('custom_components/octopus_energy_es/manifest.json', 'r') as f:
              data = json.load(f)
          
          data['version'] = "$NEW_VERSION"
          
          with open('custom_components/octopus_energy_es/manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          EOF
          echo "Updated manifest.json to version $NEW_VERSION"

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/octopus_energy_es/manifest.json
          git commit -m "Bump version to ${{ steps.calculate_version.outputs.new_version }}" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Get version for release
        id: get_version
        run: |
          VERSION="${{ steps.calculate_version.outputs.new_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version for release: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} does not exist"
          fi

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Get previous tag
        id: get_previous_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "")
          fi
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Generate changelog
        id: changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          PREVIOUS_TAG="${{ steps.get_previous_tag.outputs.previous_tag }}"
          CURRENT_SHA="${{ github.event.workflow_run.head_sha }}"
          
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "" ]; then
            # First release - get all commits
            git log --pretty=format:"- %s (%h)" --reverse > changelog.txt
          else
            # Get commits since last tag
            git log ${PREVIOUS_TAG}..${CURRENT_SHA} --pretty=format:"- %s (%h)" --reverse > changelog.txt
          fi
          
          if [ ! -s changelog.txt ]; then
            echo "- No commits found" > changelog.txt
          fi
          
          # Ensure changelog ends with a newline
          if [ -s changelog.txt ] && [ "$(tail -c1 changelog.txt)" != "" ]; then
            echo "" >> changelog.txt
          fi
          
          # Use a unique delimiter - ensure it's on its own line
          DELIMITER="CHANGELOG_END_$(date +%s)_$$"
          {
            printf "changelog<<%s\n" "${DELIMITER}"
            cat changelog.txt
            printf "%s\n" "${DELIMITER}"
          } >> $GITHUB_OUTPUT
          
          echo "Changelog:"
          cat changelog.txt

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## Release v${{ steps.get_version.outputs.version }}

            ### 📦 What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ### 🔗 Links

            - [Full Changelog](https://github.com/${{ github.repository }}/compare/${{ steps.get_previous_tag.outputs.previous_tag }}...v${{ steps.get_version.outputs.version }})
            - [Documentation](https://github.com/${{ github.repository }}#readme)
            - [Report Issues](https://github.com/${{ github.repository }}/issues)

            ---
            *This release was automatically created after successful validation.*
          draft: false
          prerelease: false

      - name: Skip release (tag exists)
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Tag v${{ steps.get_version.outputs.version }} already exists. Skipping release creation."

