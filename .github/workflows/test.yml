name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/manifest.json', '.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install Python dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install --disable-pip-version-check pytest pytest-asyncio pytest-timeout pytest-mock pytest-homeassistant-custom-component

      - name: Install integration requirements
        timeout-minutes: 5
        run: |
          pip install --disable-pip-version-check aiohttp>=3.8.0 beautifulsoup4>=4.11.0 lxml>=4.9.0 python-graphql-client>=0.4.3

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short --strict-markers
