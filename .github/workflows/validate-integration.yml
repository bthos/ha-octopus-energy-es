name: Validate Integration

on:
  push:
    paths:
      - 'integration/**'
      - '.github/workflows/validate-integration.yml'
  pull_request:
    paths:
      - 'integration/**'
      - '.github/workflows/validate-integration.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Prepare integration structure
        run: |
          # Copy integration files to root
          cp -r integration/custom_components .
          cp integration/hacs.json .
          cp integration/info.md .
          cp integration/README.md .
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"
