name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-integration:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation (Integration)
        uses: "hacs/action@main"
        with:
          category: "integration"
          path: "integration"
          ignore: "brands"

  validate-plugin:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation (Plugin)
        uses: "hacs/action@main"
        with:
          category: "plugin"
          path: "plugin"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Home Assistant hassfest
        uses: "home-assistant/actions/hassfest@master"
        with:
          root: "integration"

