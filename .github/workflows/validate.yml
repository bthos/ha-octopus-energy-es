name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-integration:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Prepare integration structure
        run: |
          # Copy integration files to root
          cp -r integration/custom_components .
          cp integration/hacs.json .
          cp integration/info.md .
          cp integration/README.md .
      - name: HACS validation (Integration)
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"

  validate-plugin:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Prepare plugin structure
        run: |
          # Copy plugin files to root
          cp -r plugin/www .
          cp plugin/hacs.json .
          cp plugin/info.md .
          cp plugin/README.md .
      - name: HACS validation (Plugin)
        uses: "hacs/action@main"
        with:
          category: "plugin"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Home Assistant hassfest
        uses: "home-assistant/actions/hassfest@master"
        with:
          root: "integration"

