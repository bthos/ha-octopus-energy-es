name: Sync Versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync (e.g., 0.4.34)'
        required: true
        type: string
  push:
    paths:
      - 'shared/version.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: read_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(cat shared/version.txt)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update integration manifest.json
        run: |
          VERSION="${{ steps.read_version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" integration/custom_components/octopus_energy_es/manifest.json

      - name: Update frontend package.json
        run: |
          VERSION="${{ steps.read_version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\",/" frontend/package.json

      - name: Update shared/version.txt
        run: |
          VERSION="${{ steps.read_version.outputs.version }}"
          echo "$VERSION" > shared/version.txt

      - name: Commit changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add integration/custom_components/octopus_energy_es/manifest.json frontend/package.json shared/version.txt
          git diff --staged --quiet || git commit -m "Sync version to ${{ steps.read_version.outputs.version }} [skip ci]"
          git push
